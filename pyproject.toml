[project]
name = "ghg-inventory"
version = "0.1.0"
description = "GHG Protocol Scope 1 and 2 inventory for a precision cutting operation"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.50", "altair>=5.5", "pandas>=2.2", "ruamel.yaml>=0.18"]

[project.scripts]
ghg-inventory = "ghg_inventory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghg_inventory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
