[theme]
base = "light"
primaryColor = "#1F3A4D"
backgroundColor = "#FAFBFB"
secondaryBackgroundColor = "#EEF2F3"
textColor = "#16242E"
linkColor = "#2A78D6"
borderColor = "#DCE3E6"
showWidgetBorder = true
baseRadius = "small"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#F1F4F5"

[client]
toolbarMode = "minimal"

[server]
headless = true
runOnSave = false
# The watchdog-based watcher crashes on disconnect under Python 3.14 on Windows; the app needs no live reload.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
